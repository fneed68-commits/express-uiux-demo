name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Trigger Render Deploy
        run: |
          # تنظيف الرابط من أي مسافات أو أسطر مخفية
          URL=$(printf '%s' "$RENDER_DEPLOY_HOOK" | tr -d '[:space:]')

          # التحقق من صحة الرابط قبل الإرسال
          if [[ ! "$URL" =~ ^https://api\.render\.com/deploy/srv- ]]; then
            echo "::error::RENDER_DEPLOY_HOOK غير صحيح أو يحتوي على أحرف مخفية!"
            echo "طول الرابط الحالي: ${#URL}"
            exit 1
          fi

          echo "✅ الرابط نظيف (الطول: ${#URL} حرف)"
          curl -fsS -X POST "$URL"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
